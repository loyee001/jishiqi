/* Electric instrument panel and sculpted numeric display. */
body { background-image: radial-gradient(ellipse at 75% 30%, #14315255, transparent 60%), linear-gradient(#3c779909 1px, transparent 1px), linear-gradient(90deg, #3c779909 1px, transparent 1px); background-size: auto, 48px 48px, 48px 48px; }
.topbar { border-bottom-color: #264459; }
.brand-mark { text-shadow: 0 0 16px #57dbff66; }
.workspace { border-radius: 16px; border-color: #2c4e69; box-shadow: 0 22px 70px #0005, inset 0 1px #7bdfff14; }
.settings { background: linear-gradient(145deg, #11233888, #09142244); }
.mode-tabs { border-radius: 6px; box-shadow: inset 0 2px 8px #0007; }
.mode-tabs button { border-radius: 3px; }
.mode-tabs button[aria-selected=true] { box-shadow: inset 0 1px #85d8ff40, 0 2px 5px #0005; color: #a7ebff; }
.duration-inputs input { border-radius: 5px; box-shadow: inset 0 3px 9px #0006, 0 1px #70cfff14; }
.presets button { border-radius: 4px; }
.timer-panel { --digit-top: #e3fcff; --digit-mid: #7ae7ff; --digit-low: #209ac7; --digit-depth: #075279; --digit-glow: #38cdff66; --digit-bevel: #eaffff; --timer-signal: #57dbff; background: radial-gradient(ellipse at 50% 44%, #12426477, #0a172877 63%), linear-gradient(135deg, #1b45691c, transparent); }
.timer-panel::before,.timer-panel::after { content: ''; position: absolute; width: 20px; height: 20px; pointer-events: none; border-color: #57dbff88; border-style: solid; }
.timer-panel::before { left: 15px; top: 15px; border-width: 1px 0 0 1px; }
.timer-panel::after { right: 15px; bottom: 15px; border-width: 0 1px 1px 0; }
.timer-topline { padding: 0 8px; }
.dial-track { stroke: #29516a; stroke-width: 1; }
.dial-progress { stroke: var(--timer-signal); stroke-width: 3; filter: drop-shadow(0 0 4px var(--digit-glow)); }
.dial-inner { stroke: #5f99b9; stroke-width: 4; stroke-dasharray: 1 13; opacity: .5; }
.timer-face>p:first-child { letter-spacing: 5px; color: #99b9cc; margin-bottom: 20px; }
.digits,.digit-labels { width: 88%; grid-template-columns: 1fr .17fr 1fr .17fr 1fr; }
.digits { color: var(--timer-signal); align-items: center; font-size: 0; letter-spacing: 0; isolation: isolate; }
.digits.has-three-hours,.digits.has-three-hours+.digit-labels { grid-template-columns: 1.5fr .17fr 1fr .17fr 1fr; }
.digits>span { position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 0; filter: drop-shadow(0 0 8px var(--digit-glow)); }
.digits>span:first-child { padding-left: 0; }
.digit-value { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.tech-digit { width: 50%; height: auto; min-width: 0; overflow: visible; stroke: none; fill: none; flex-shrink: 1; }
.has-three-hours #display-hours .tech-digit { width: 33.333333%; }
.metal-top { stop-color: var(--digit-top); }.metal-mid { stop-color: var(--digit-mid); }.metal-low { stop-color: var(--digit-low); }
.segment-depth { fill: var(--digit-depth); stroke: #0007; stroke-width: .7; }
.segment-face { stroke: #051d3566; stroke-width: .6; }
.segment-bevel { fill: none; stroke: var(--digit-bevel); stroke-opacity: .52; stroke-width: .8; stroke-linejoin: miter; }
.digits b { position: relative; width: 100%; height: 38px; font-size: 0; transform: skewX(-6deg); color: var(--timer-signal); filter: drop-shadow(0 0 6px var(--digit-glow)); }
.digits b::before,.digits b::after { content: ''; position: absolute; left: 50%; width: 5px; height: 5px; background: currentColor; box-shadow: 0 2px 0 var(--digit-depth); transform: translateX(-50%) rotate(45deg); }
.digits b::before { top: 5px; }.digits b::after { bottom: 5px; }
.digit-labels { color: #8facbf; margin-top: 12px; }
.timer-detail { color: var(--timer-signal); letter-spacing: 1px; }
.status.running,.status.done { color: var(--timer-signal); }
.status.running::before,.status.done::before { background: var(--timer-signal); box-shadow: 0 0 8px var(--digit-glow); }
.primary-button { border-radius: 5px!important; background: linear-gradient(160deg, #b2f2ff 0%, #57dbff 48%, #2eabd8 49%, #49c9ed 100%); box-shadow: inset 0 1px 0 #fff9, 0 4px 0 #116384, 0 5px 20px #27c2ff20; border-color: #93e8ff; }
.primary-button:hover { background: linear-gradient(160deg, #ddfaff, #6be3ff 48%, #38b4de 49%, #62dcff); }
.reset-button { border-radius: 5px!important; background: linear-gradient(#142c40, #0b1929); box-shadow: inset 0 1px #8bdfff1c, 0 3px 0 #040b16; }
.timer-panel.is-urgent { --digit-top: #ffe5e7; --digit-mid: #ff6b78; --digit-low: #d72442; --digit-depth: #761d37; --digit-glow: #ff354c77; --digit-bevel: #ffe2e6; --timer-signal: #ff5166; background: radial-gradient(ellipse at 50% 44%, #661c344d, #0a172877 65%); }
.is-urgent .dial-inner { stroke: #bb4c61; }.is-urgent .dial-track { stroke: #6a3046; }
.is-urgent .timer-face>p:first-child { color: #ff9ba8; }.is-urgent::before,.is-urgent::after { border-color: #ff516688; }
@media(max-width:900px) and (min-width:681px) { .digits,.digit-labels { width: 90%; }.timer-face>p:first-child { margin-bottom: 14px; }.timer-detail { margin-top: 17px; } }
@media(max-width:680px) { .workspace { border-radius: 12px; }.settings { background: none; }.timer-panel::before,.timer-panel::after { width: 12px; height: 12px; }.timer-panel::before { top: 14px; left: 12px; }.timer-panel::after { right: 12px; bottom: 12px; }.timer-topline { padding: 0 6px; }.digits,.digit-labels { width: 85%; }.timer-face>p:first-child { margin-bottom: 14px; }.timer-detail { margin-top: 18px; }.digits b { height: 28px; }.digits b::before,.digits b::after { width: 4px; height: 4px; } }

/* Deep-space geometry stays behind every interactive surface. */
body { min-height: 100vh; isolation: isolate; background: #040b18; }
.app { position: relative; z-index: 1; }
.tech-background { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: radial-gradient(ellipse at 13% 23%, #087eac40, transparent 43%), radial-gradient(ellipse at 87% 57%, #263ea54d, transparent 50%), linear-gradient(155deg, #030914 5%, #07172b 47%, #030918 100%); }
.space-grid { position: absolute; inset: 0; background-image: linear-gradient(#58caff14 1px, transparent 1px), linear-gradient(90deg, #58caff14 1px, transparent 1px), radial-gradient(circle, #8fe7ff88 1px, transparent 1.8px); background-size: 76px 76px, 76px 76px, 152px 152px; mask-image: linear-gradient(110deg, #000, #0005 45%, #000b); opacity: .75; }
.space-grid::before { content: ''; position: absolute; width: 50vw; height: 1px; left: -8vw; top: 28%; transform: rotate(-32deg); background: linear-gradient(90deg, transparent, #44ceff99, transparent); box-shadow: 0 0 15px #2ca7ff88; }
.space-grid::after { content: ''; position: absolute; width: 55vw; height: 1px; right: -5vw; top: 17%; transform: rotate(32deg); background: linear-gradient(90deg, transparent, #387eff77, transparent); }
.orbital-rings { position: absolute; width: 760px; height: 760px; right: -340px; top: -90px; border: 1px solid #49c9ff35; border-radius: 50%; box-shadow: 0 0 0 28px #37baff08, 0 0 0 29px #49c9ff28, 0 0 0 80px #1b8dcb08, 0 0 0 81px #49c9ff20, inset 0 0 90px #158cdb0b; transform: rotate(-20deg); }
.orbital-rings::before { content: ''; position: absolute; inset: 56px; border-radius: 50%; border: 1px dashed #70dfff2b; }
.orbital-rings::after { content: ''; position: absolute; inset: -46px; border-radius: 50%; border: 2px solid transparent; border-top-color: #51caff55; border-left-color: #51caff22; filter: drop-shadow(0 0 8px #36bbff44); }
.perspective-grid { position: absolute; left: -50%; width: 200%; top: 69%; height: 90%; transform-origin: center top; transform: perspective(500px) rotateX(62deg); background-image: linear-gradient(#47bcff40 1px, transparent 1px), linear-gradient(90deg, #47bcff40 1px, transparent 1px); background-size: 74px 58px; mask-image: linear-gradient(transparent, #000c 14%, #0007 70%, transparent); }
.light-streams { position: absolute; inset: 0; overflow: hidden; opacity: .65; }
.light-streams i { position: absolute; width: 1px; height: 190px; top: -230px; left: 8%; background: linear-gradient(transparent, #4dcfff55 70%, #9aefffbb); box-shadow: 0 0 12px #35c6ff66; animation: data-flow 22s linear infinite; }
.light-streams i:nth-child(2) { left: 27%; animation-delay: -15s; animation-duration: 28s; height: 140px; opacity: .4; }
.light-streams i:nth-child(3) { left: 83%; animation-delay: -7s; animation-duration: 25s; height: 230px; }
.light-streams i:nth-child(4) { left: 95%; animation-delay: -19s; animation-duration: 32s; opacity: .5; }
.horizon-glow { position: absolute; left: 4%; right: 4%; height: 1px; top: 69%; background: linear-gradient(90deg, transparent, #32bbff66, #72dcff99, #32bbff66, transparent); box-shadow: 0 0 26px 4px #20a4ff26; }
@keyframes data-flow { from { transform: translate3d(0, -20px, 0); } to { transform: translate3d(0, calc(100vh + 460px), 0); } }
.workspace { background: #071425d9; border-color: #417399b3; box-shadow: 0 24px 70px #0008, 0 0 38px #117fb31c, inset 0 1px #a5eaff26; }
.settings { background: linear-gradient(145deg, #173b5677, #081421aa); }
.timer-panel { isolation: isolate; background: radial-gradient(ellipse at 50% 45%, #103b59cc 0%, #0a1c34aa 43%, #06122388 85%); }
.panel-grid { position: absolute; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; background-image: linear-gradient(#3aa5d713 1px, transparent 1px), linear-gradient(90deg, #3aa5d713 1px, transparent 1px); background-size: 36px 36px; mask-image: radial-gradient(ellipse at 50% 43%, transparent 24%, #000 75%); }
.panel-grid::before { content: ''; position: absolute; width: 92%; height: 92%; left: 4%; top: 2%; border: 1px solid #4eccff20; border-radius: 50%; transform: scaleY(.86); box-shadow: 0 0 0 16px #168cff06, 0 0 0 17px #55caff10; }

  }
  tabs.forEach(el => { el.addEventListener('click', () => setMode(el.dataset.mode)); el.addEventListener('keydown', e => { if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) { e.preventDefault(); const next = e.key === 'Home' ? tabs[0] : e.key === 'End' ? tabs[1] : tabs.find(t => t !== el); setMode(next.dataset.mode); next.focus(); } }); });
  fields.forEach(el => el.addEventListener('input', readDuration));
  presets.forEach(el => el.addEventListener('click', () => { const nums = parts(Number(el.dataset.seconds)); fields.forEach((f, i) => f.value = nums[i]); readDuration(); }));

<body>
<div class="tech-background" aria-hidden="true">
  <div class="aurora aurora-cool"></div>

    <div class="intro"><span class="eyebrow">PRECISION TIMER / 100 H</span><h1>专注此刻，<span>掌控时间。</span></h1></div>
    <section class="workspace" aria-label="计时器">
      <aside class="settings">
        <div class="mode-tabs" role="tablist" aria-label="计时模式"><button role="tab" id="countdown-tab" aria-selected="true" aria-controls="timer-panel" data-mode="countdown">倒计时</button><button role="tab" id="stopwatch-tab" aria-selected="false" aria-controls="timer-panel" data-mode="stopwatch" tabindex="-1">正计时</button></div>

          <p id="input-error" class="input-error" role="alert"></p>

        </div>
        <div id="stopwatch-settings" hidden><div class="section-heading"><h2>从零开始</h2><span>最长 100 小时</span></div><p class="stopwatch-copy">无需设置时长。按下开始，记录每一秒。</p><div class="limit"><span>计时上限</span><strong>100:00:00</strong></div></div>
        <div class="settings-bottom">
          <div class="music-controls">
            <label class="sound-label music-label"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></svg>计时背景音乐</span><input id="music" type="checkbox" checked role="switch"><span class="switch" aria-hidden="true"></span></label>

        <div class="actions"><button class="reset-button" id="reset" aria-label="重置计时器"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 3v7h7"/></svg><span>重置</span></button><button class="primary-button" id="start"><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><span id="start-label">开始计时</span></button></div>
        <p class="keyboard-hint"><kbd>Space</kbd> 开始 / 暂停</p>
      </div>
    </section>
    <footer><span>一秒一秒，做好眼前的事。</span><span>此刻 <i>·</i> JUST NOW</span></footer>
  </main>
</div>
<div id="completion" class="completion" role="status" hidden><span class="completion-symbol">✓</span><div><strong id="completion-title">时间到</strong><p id="completion-text">这一段时间，完成了。</p></div><button id="dismiss" aria-label="关闭完成提示">×</button></div>
